<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}The 5-Minute Experiment{% endblock %} · DARINGMATES</title>
  <meta name="description" content="Five Minutes. One New Experience. A Different You.">
  <meta name="theme-color" content="#101426">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  {% include '_nav.html' %}
  <main id="main">{% block content %}{% endblock %}</main>
  {% include '_footer.html' %}
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="{{ url_for('static', filename='js/experiments.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
